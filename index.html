<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mise en Place</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script crossorigin src="libs/react.min.js"></script>
  <script crossorigin src="libs/react-dom.min.js"></script>
  <script src="libs/babel.min.js"></script>
  <script src="libs/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #E8E2D5;
      --header: #1D3829;
      --dark-green: #1D3829;
      --text: #1a1a1a;
      --text-muted: #999;
      --text-secondary: #666;
      --border: #DDD6C8;
      --card-bg: #fff;
      --orange: #C1440E;
      --star: #D4A017;
      --easy-bg: #E8F5EA;
      --easy-text: #2E7D32;
      --medium-bg: #FFF8E1;
      --medium-text: #9A6500;
      --medium-border: #E8A000;
      --tab-active: #C1440E;
      --input-bg: #FAF7F2;
    }

    body {
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
    }

    /* ── LOGIN ── */
    .login-page {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
      gap: 12px;
    }
    .login-logo-icon {
      width: 60px;
      height: 60px;
      background: var(--dark-green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
    }
    .login-logo h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      color: var(--dark-green);
      font-weight: 600;
    }
    .login-logo p {
      font-size: 11px;
      letter-spacing: 2.5px;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .login-tabs {
      display: flex;
      background: #f3f4f6;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
      gap: 4px;
    }
    .login-tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }
    .login-tab.active {
      background: #fff;
      color: var(--dark);
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.06);
    }
    .login-error {
      background: #FEE2E2;
      color: #B91C1C;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      color: var(--text);
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--dark-green); }
    .form-input::placeholder { color: #ccc; }
    .password-wrap { position: relative; }
    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      font-size: 16px;
      padding: 4px;
      line-height: 1;
    }
    .btn-signin {
      width: 100%;
      padding: 16px;
      background: var(--dark-green);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 8px;
      font-family: inherit;
      transition: opacity 0.2s;
    }
    .btn-signin:hover { opacity: 0.88; }
    .reset-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }
    .reset-link:hover { color: var(--text-secondary); }

    /* ── HEADER ── */
    .app-header {
      background: var(--dark-green);
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-brand {
      display: flex;
      align-items: center;
      font-family: 'Playfair Display', serif;
      color: #fff;
      font-size: 18px;
      gap: 0;
    }
    .header-brand .sparkle { margin-right: 8px; }
    .header-brand .slash {
      font-style: italic;
      color: rgba(255,255,255,0.6);
      margin-left: 8px;
      font-size: 16px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header-user {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
    }
    .header-user span { color: #fff; font-weight: 600; }
    .btn-signout {
      padding: 7px 16px;
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.45);
      color: #fff;
      border-radius: 6px;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      transition: border-color 0.2s;
    }
    .btn-signout:hover { border-color: #fff; }
    .btn-community {
      padding: 9px 20px;
      background: #fff;
      border: none;
      color: var(--dark);
      border-radius: 8px;
      font-size: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-community:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.25); }

    /* ── COMMUNITY PAGE ── */
    .community-page {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    .community-header {
      background: var(--header);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .community-header-brand {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .community-header-right { display: flex; gap: 12px; align-items: center; }
    .btn-back-recipes {
      padding: 7px 16px;
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.45);
      color: #fff;
      border-radius: 6px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      transition: border-color 0.2s;
    }
    .btn-back-recipes:hover { border-color: #fff; }
    .community-content { padding: 32px; max-width: 1100px; margin: 0 auto; width: 100%; }
    .community-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .community-title-row h2 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      color: var(--text);
    }
    .community-title-row p { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
    .btn-share-recipe {
      padding: 12px 24px;
      background: var(--dark-green);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s;
    }
    .btn-share-recipe:hover { opacity: 0.85; }
    .community-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .community-card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .community-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
    .community-card-body { padding: 18px; }
    .community-card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .community-card-cat {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--dark-green);
    }
    .community-card-by {
      font-size: 11px;
      color: var(--text-secondary);
    }
    .community-card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      color: var(--text);
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .community-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .btn-save-recipe {
      padding: 8px 18px;
      background: var(--dark-green);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-save-recipe:hover { opacity: 0.85; }
    .btn-save-recipe.saved { background: #888; cursor: default; }
    .community-empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-secondary);
    }
    .community-empty .community-icon { font-size: 56px; margin-bottom: 16px; }
    .community-empty h3 { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--text); margin-bottom: 8px; }
    .community-loading { text-align: center; padding: 60px; color: var(--text-secondary); font-size: 16px; }
    .share-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center; z-index: 300;
    }
    .share-modal {
      background: #fff; border-radius: 16px; padding: 32px;
      max-width: 480px; width: 90%; max-height: 80vh; overflow-y: auto;
    }
    .share-modal h3 { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 6px; }
    .share-modal p { font-size: 14px; color: var(--text-secondary); margin-bottom: 14px; }
    .share-search {
      display: flex; align-items: center; gap: 10px;
      background: #f3f4f6; border-radius: 10px; padding: 10px 14px;
      margin-bottom: 14px;
    }
    .share-search input {
      border: none; background: transparent; font-family: inherit;
      font-size: 14px; width: 100%; outline: none; color: var(--text);
    }
    .share-recipe-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; max-height: 320px; overflow-y: auto; }
    .share-recipe-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border: 1.5px solid var(--border);
      border-radius: 10px; cursor: pointer; transition: border-color 0.2s, background 0.2s;
    }
    .share-recipe-item:hover { border-color: var(--dark-green); background: #f9f9f7; }
    .share-recipe-item.selected { border-color: var(--dark-green); background: #f0f5f0; }
    .share-recipe-item-info { display: flex; flex-direction: column; gap: 2px; }
    .share-recipe-item-title { font-size: 14px; font-weight: 600; color: var(--text); }
    .share-recipe-item-meta { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
    .share-modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-cancel-share {
      padding: 10px 20px; background: transparent; border: 1.5px solid var(--border);
      border-radius: 8px; font-family: inherit; font-size: 13px; cursor: pointer;
    }
    .btn-confirm-share {
      padding: 10px 20px; background: var(--dark-green); color: #fff;
      border: none; border-radius: 8px; font-family: inherit; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: opacity 0.2s;
    }
    .btn-confirm-share:hover { opacity: 0.85; }
    .btn-confirm-share:disabled { opacity: 0.5; cursor: default; }

    /* ── CATEGORY NAV ── */
    .category-nav {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .category-nav::-webkit-scrollbar { display: none; }
    .category-nav-inner {
      display: flex;
      white-space: nowrap;
    }
    .cat-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 14px 16px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-secondary);
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 2.5px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      font-family: inherit;
      white-space: nowrap;
    }
    .cat-tab:hover { color: var(--text); }
    .cat-tab.active {
      color: var(--text);
      border-bottom-color: var(--tab-active);
    }
    .cat-count {
      background: #1D3829;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      padding: 0 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cat-tab.active .cat-count { background: var(--tab-active); }

    /* ── RECIPE LIST ── */
    .page-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }
    .list-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 32px;
      gap: 16px;
    }
    .list-title h2 {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      color: var(--dark-green);
      font-weight: 600;
    }
    .list-title p {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .btn-add {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 24px;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-add:hover { opacity: 0.88; }
    .search-bar {
      position: relative;
      margin-bottom: 40px;
    }
    .search-bar input {
      width: 100%;
      padding: 16px 20px 16px 50px;
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 40px;
      font-size: 15px;
      color: var(--text);
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-bar input:focus { border-color: var(--dark-green); }
    .search-bar input::placeholder { color: #bbb; }
    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #bbb;
      font-size: 16px;
      pointer-events: none;
    }
    .category-section { margin-bottom: 48px; }
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .section-header h3 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: var(--dark-green);
      font-weight: 700;
    }
    .section-count {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 400;
      font-family: 'Inter', sans-serif;
    }
    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    /* ── RECIPE CARD ── */
    .recipe-card {
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .recipe-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    .card-photo {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .card-photo-placeholder {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #f0ebe0, #e0d9cc);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
    }
    .card-body { padding: 16px; }
    .card-category {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .card-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .stars { display: flex; gap: 2px; }
    .difficulty-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .difficulty-easy { background: var(--easy-bg); color: var(--easy-text); }
    .difficulty-medium { background: var(--medium-bg); color: var(--medium-text); border: 1px solid var(--medium-border); }
    .difficulty-hard { background: #FEE2E2; color: #B91C1C; }
    .card-description {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin: 8px 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 12px 0;
    }
    .card-timing {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .timing-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* category label colors */
    .cat-starters { color: #2E7D32; }
    .cat-soups-salads { color: #1565C0; }
    .cat-mains { color: #546E7A; }
    .cat-sides { color: #388E3C; }
    .cat-desserts { color: #E65100; }
    .cat-snacks { color: #6A1B9A; }
    .cat-drinks { color: #0277BD; }
    .cat-breakfast { color: #F57F17; }

    /* ── RECIPE DETAIL ── */
    .detail-page {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }
    .detail-back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
      color: var(--dark-green);
      cursor: pointer;
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      margin-bottom: 28px;
      padding: 9px 16px;
      transition: border-color 0.2s, background 0.2s;
    }
    .detail-back:hover { border-color: var(--dark-green); background: var(--input-bg); }
    .detail-photo {
      width: 100%;
      height: 340px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 28px;
      display: block;
    }
    .detail-photo-placeholder {
      width: 100%;
      height: 280px;
      background: linear-gradient(135deg, #f0ebe0, #e0d9cc);
      border-radius: 14px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
    }
    .detail-title {
      font-family: 'Playfair Display', serif;
      font-size: 38px;
      font-weight: 700;
      color: var(--dark-green);
      margin-bottom: 20px;
      line-height: 1.2;
    }
    .detail-timing-bar {
      background: var(--input-bg);
      border-radius: 10px;
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .timing-bar-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;

<body>
  <div id="loading-screen" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#E8E2D5;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:serif">
    <div style="font-size:48px">✦</div>
    <div style="font-size:26px;color:#1D3829;margin-top:12px;font-weight:600">Mise en Place</div>
    <div style="font-size:14px;color:#888;margin-top:10px;font-family:sans-serif">Loading...</div>
  </div>
  <div id="root"></div>
  <script>
    window.onerror = function(msg, src, line) {
      document.getElementById('loading-screen').innerHTML = '<div style="padding:30px;font-family:sans-serif;color:#c00;font-size:14px"><strong>Error loading app:</strong><br>' + msg + '<br><small>' + src + ' line ' + line + '</small></div>';
    };
  </script>
  <script type="text/babel">
    const { useState, useEffect, useRef, Component } = React;

    class ErrorBoundary extends Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(e) { return { error: e }; }
      render() {
        if (this.state.error) {
          return (
            <div style={{padding:40,textAlign:'center',fontFamily:'sans-serif'}}>
              <div style={{fontSize:48,marginBottom:16}}>😬</div>
              <h2 style={{marginBottom:8}}>Something went wrong</h2>
              <p style={{color:'#888',marginBottom:24}}>{this.state.error.message}</p>
              <button onClick={() => this.setState({error:null})} style={{padding:'10px 24px',background:'#1D3829',color:'#fff',border:'none',borderRadius:8,cursor:'pointer',fontFamily:'inherit',fontSize:14}}>Try Again</button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ── STORAGE ──
    // Multi-user: stored as a map of email → user object
    const getUsers   = () => { try { return JSON.parse(localStorage.getItem('mep_users')) || {}; } catch { return {}; } };
    const saveUsers  = us => localStorage.setItem('mep_users', JSON.stringify(us));
    const getUser    = email => { const us = getUsers(); return email ? (us[email] || null) : null; };
    const saveUser   = u => { const us = getUsers(); us[u.email] = u; saveUsers(us); };
    const getCurrentUser = () => { const e = localStorage.getItem('mep_session'); return e ? getUser(e) : null; };

    // ── SUPABASE (community recipes) ──
    const SUPA_URL = 'https://optjddudiebhbljgucst.supabase.co';
    const SUPA_KEY = 'sb_publishable_Ir1gjfM1Lc83nYN-AIYWkA_9DzZkPdk';
    const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

    const LEO_EMAIL = 'leogivon9@gmail.com';

    const fetchCommunityRecipes = async () => {
      const { data, error } = await supa.from('community_recipes').select('*').eq('status','approved').order('shared_at', { ascending: false });
      if (error) { console.warn('fetch error', error); return []; }
      return data || [];
    };
    const fetchPendingRecipes = async () => {
      const { data, error } = await supa.from('community_recipes').select('*').eq('status','pending').order('shared_at', { ascending: false });
      if (error) { console.warn('fetch pending error', error); return []; }
      return data || [];
    };
    const fetchMyPendingRecipes = async (userName) => {
      const { data, error } = await supa.from('community_recipes').select('*').in('status', ['pending','rejected']).eq('shared_by', userName).order('shared_at', { ascending: false });
      if (error) { console.warn('fetch my pending error', error); return []; }
      return data || [];
    };
    const notifyLeo = async (recipeName, submittedBy) => {
      try {
        const res = await fetch('https://ntfy.sh/mep-leo-approvals', {
          method: 'POST',
          body: `${submittedBy} wants to share "${recipeName}" — open the app to approve or reject!`,
          headers: {
            'Title': '🍳 New Recipe Awaiting Approval',
            'Priority': 'default',
            'Tags': 'cooking'
          }
        });
        console.log('ntfy status:', res.status);
      } catch(e) { console.warn('ntfy failed:', e); }
    };

    const uploadPhotoToSupabase = async (email, recipeId, dataUrl) => {
      if (!dataUrl || dataUrl.startsWith('http')) return dataUrl || null;
      try {
        const res = await fetch(dataUrl);
        const blob = await res.blob();
        const path = `${email.replace(/[@.]/g, '_')}/${recipeId}`;
        const { error } = await supa.storage.from('recipe-photos').upload(path, blob, { upsert: true, contentType: blob.type || 'image/jpeg' });
        if (error) { console.warn('photo upload error:', error); return null; }
        const { data } = supa.storage.from('recipe-photos').getPublicUrl(path);
        return data.publicUrl;
      } catch(e) { console.warn('photo upload failed:', e); return null; }
    };

    const shareToCommunity = async (recipe, userName, status = 'pending', photoUrl = null) => {
      const { error } = await supa.from('community_recipes').insert({
        original_id: recipe.id,
        title: recipe.name || recipe.title,
        description: recipe.description || '',
        category: recipe.category || '',
        difficulty: recipe.difficulty || '',
        rating: recipe.rating || 5,
        prep_time: recipe.prepTime || '',
        cook_time: recipe.cookTime || '',
        serves: recipe.serves || '',
        ingredients: recipe.ingredients || '',
        method: recipe.method || '',
        shared_by: userName,
        status,
        photo_url: photoUrl,
      });
      return !error;
    };
    const approveCommunityRecipe = async (id) => {
      const { error } = await supa.from('community_recipes').update({ status: 'approved' }).eq('id', id);
      return !error;
    };
    const deleteFromCommunity = async (id) => {
      await supa.from('community_recipes').delete().eq('id', id);
    };
    const rejectCommunityRecipe = async (id) => {
      await supa.from('community_recipes').update({ status: 'rejected' }).eq('id', id);
    };

    // ── MESSAGES ──
    const sendMessage = async (fromName, fromEmail, messageText) => {
      const { error } = await supa.from('messages').insert({
        from_name: fromName, from_email: fromEmail, message: messageText, is_read: false
      });
      return !error;
    };
    const fetchMessages = async () => {
      const { data, error } = await supa.from('messages').select('*').order('sent_at', { ascending: false });
      if (error) { console.warn('fetch messages error', error); return []; }
      return data || [];
    };
    const fetchUnreadMessageCount = async () => {
      const { count, error } = await supa.from('messages').select('*', { count: 'exact', head: true }).eq('is_read', false);
      if (error) return 0;
      return count || 0;
    };
    const markAllMessagesRead = async () => {
      await supa.from('messages').update({ is_read: true }).eq('is_read', false);
    };
    const sendReply = async (id, replyText) => {
      const { error } = await supa.from('messages').update({ reply: replyText, replied_at: new Date().toISOString() }).eq('id', id);
      return !error;
    };
    const fetchMyMessages = async (email) => {
      const { data, error } = await supa.from('messages').select('*').eq('from_email', email).order('sent_at', { ascending: false });
      if (error) return [];
      return data || [];
    };

    // ── INDEXEDDB FOR PHOTOS (no size limit issues) ──
    const DB_NAME = 'mise-en-place-photos', DB_VER = 1, STORE = 'photos';
    const openDB = () => new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, DB_VER);
      r.onupgradeneeded = e => e.target.result.createObjectStore(STORE);
      r.onsuccess = e => res(e.target.result);
      r.onerror   = () => rej(r.error);
    });
    const idbPut = async (id, photo) => {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(STORE, 'readwrite');
        photo ? tx.objectStore(STORE).put(photo, id) : tx.objectStore(STORE).delete(id);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    };
    const idbGetAll = async () => {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(STORE, 'readonly');
        const out = {};
        tx.objectStore(STORE).openCursor().onsuccess = e => {
          const c = e.target.result;
          if (c) { out[c.key] = c.value; c.continue(); } else res(out);
        };
        tx.onerror = () => rej(tx.error);
      });
    };
    const idbDelete = async id => {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    };

    // ── CLOUD RECIPE STORAGE (Supabase) with localStorage fallback ──
    const recipeKey = email => email ? `mep_recipes_${email}` : 'mep_recipes';

    const getRecipeText = (email) => {
      try { return JSON.parse(localStorage.getItem(recipeKey(email))) || []; } catch { return []; }
    };
    const saveRecipeText = (recipes, email) => {
      const slim = recipes.map(({ photo, ...r }) => r);
      try { localStorage.setItem(recipeKey(email), JSON.stringify(slim)); } catch(e) { console.warn(e); }
    };

    const loadRecipesFromCloud = async (email) => {
      const { data, error } = await supa.from('user_recipes').select('*').eq('user_email', email).order('created_at', { ascending: true });
      if (error || !data || data.length === 0) return null;
      return data.map(r => ({
        id: r.id, name: r.name, description: r.description || '',
        category: r.category || '', difficulty: r.difficulty || '',
        rating: r.rating || 5, prepTime: r.prep_time || '',
        cookTime: r.cook_time || '', serves: r.serves || '',
        ingredients: r.ingredients || '', method: r.method || '',
        photoUrl: r.photo_url || null, addedDate: r.added_date || '',
      }));
    };

    const saveRecipeToCloud = async (recipe, email) => {
      await supa.from('user_recipes').upsert({
        id: recipe.id, user_email: email,
        name: recipe.name || '', description: recipe.description || '',
        category: recipe.category || '', difficulty: recipe.difficulty || '',
        rating: recipe.rating || 5, prep_time: recipe.prepTime || '',
        cook_time: recipe.cookTime || '', serves: recipe.serves || '',
        ingredients: recipe.ingredients || '', method: recipe.method || '',
        photo_url: recipe.photoUrl || null, added_date: recipe.addedDate || '',
      }, { onConflict: 'id,user_email' });
    };

    const deleteRecipeFromCloud = async (id, email) => {
      await supa.from('user_recipes').delete().eq('id', id).eq('user_email', email);
    };

    const saveAllRecipesToCloud = async (recipes, email) => {
      for (const r of recipes) await saveRecipeToCloud(r, email);
    };

    // Save photos async — fire and forget from callers
    const savePhotos = recipes => recipes.forEach(r => { if (r.photo !== undefined) idbPut(r.id, r.photo || null); });
    const saveRecipes = recipes => { saveRecipeText(recipes); savePhotos(recipes); };

    // ── CATEGORIES ──
    const CATEGORIES = [
      { id: 'all',         label: 'All',            fullLabel: 'All Recipes',          emoji: '✦',  colorClass: '' },
      { id: 'starters',    label: 'Starters',        fullLabel: 'Starters & Appetisers', emoji: '🥗', colorClass: 'cat-starters' },
      { id: 'soups-salads',label: 'Soups & Salads',  fullLabel: 'Soups & Salads',        emoji: '🥣', colorClass: 'cat-soups-salads' },
      { id: 'mains',       label: 'Mains',           fullLabel: 'Main Course',           emoji: '🍽️', colorClass: 'cat-mains' },
      { id: 'sides',       label: 'Sides',           fullLabel: 'Side Dishes',           emoji: '🥦', colorClass: 'cat-sides' },
      { id: 'desserts',    label: 'Desserts',        fullLabel: 'Desserts',              emoji: '🍰', colorClass: 'cat-desserts' },
      { id: 'snacks',      label: 'Snacks',          fullLabel: 'Snacks',                emoji: '🧀', colorClass: 'cat-snacks' },
      { id: 'drinks',      label: 'Drinks',          fullLabel: 'Drinks',                emoji: '🥂', colorClass: 'cat-drinks' },
      { id: 'breakfast',   label: 'Breakfast',       fullLabel: 'Breakfast & Brunch',    emoji: '🍳', colorClass: 'cat-breakfast' },
    ];

    const getCat = id => CATEGORIES.find(c => c.id === id);

    const formatDate = iso => {
      const d = new Date(iso);

    const compressImage = (file, callback) => {
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          // Try progressively smaller sizes until it fits in localStorage (~300KB limit per photo)
          const sizes   = [700, 500, 350];
          const quality = 0.65;
          let result = null;
          for (const MAX of sizes) {
            let w = img.width, h = img.height;
            if (w > MAX || h > MAX) {
              if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
              else       { w = Math.round(w * MAX / h); h = MAX; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            result = canvas.toDataURL('image/jpeg', quality);
            // base64 length * 0.75 = approx bytes; keep under 300KB
            if (result.length * 0.75 < 300000) break;
          }
          callback(result);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };

                      <button onClick={() => handleRemove(r)} style={{background:'transparent',border:`1.5px solid ${r.status==='rejected'?'#fca5a5':'#bae6fd'}`,color:r.status==='rejected'?'#dc2626':'#0284c7',borderRadius:6,padding:'6px 12px',fontSize:12,fontFamily:'inherit',cursor:'pointer',fontWeight:600}}>

              <div className="community-grid">

                  const isOwner = isLeo || r.shared_by === user.name;
                  return (
                    <div key={r.id} className="community-card" onClick={() => setSelectedRecipe(r)}>

                        <Stars rating={r.rating || 5} size={13} />

                          <div style={{fontSize:12,color:'#888'}}>
                            {r.prep_time && `⏱ ${r.prep_time} prep`}
                          </div>
                          <div style={{display:'flex',gap:6}} onClick={e => e.stopPropagation()}>
                            {isOwner && (
                              <button
                                onClick={() => handleRemove(r)}
                                style={{padding:'6px 10px',background:'transparent',border:'1.5px solid #ffaaaa',color:'#c00',borderRadius:6,fontSize:11,cursor:'pointer',fontFamily:'inherit',fontWeight:600}}>
                                🗑️ Remove

                            )}
                            <button
                              className={`btn-save-recipe ${alreadySaved ? 'saved' : ''}`}
                              onClick={() => !alreadySaved && handleSave(r)}
                              disabled={alreadySaved}>
                              {alreadySaved ? '✓ Saved' : '❤️ Save it'}
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {showShareModal && (
            <div className="share-modal-overlay" onClick={e => e.target === e.currentTarget && setShowShareModal(false)}>
              <div className="share-modal">
                <h3>Share a Recipe 📤</h3>
                <p>Pick which recipes to share with friends & family:</p>
                <div style={{display:'flex',gap:8,marginBottom:14}}>
                  <input
                    type="text"
                    placeholder="Search your recipes..."
                    value={shareSearch}
                    onChange={e => setShareSearch(e.target.value)}
                    style={{flex:1,padding:'10px 14px',border:'1.5px solid #ddd',borderRadius:8,fontFamily:'inherit',fontSize:14,outline:'none'}}
                  />
                </div>
                <div style={{display:'block',maxHeight:300,overflowY:'auto',marginBottom:16}}>
                  {(myRecipes || [])
                    .filter(r => r && (r.name || r.title) && (r.name || r.title).toLowerCase().includes((shareSearch || '').toLowerCase()))
                    .map((r, i) => {
                      const isSelected = selectedRecipes.some(x => x.id === r.id);
                      const recipeName = r.name || r.title || 'Untitled';
                      return (
                        <div key={r.id || i}
                          onClick={() => toggleSelect(r)}
                          style={{
                            display:'flex', alignItems:'center', gap:12,
                            padding:'12px 16px', border: isSelected ? '2px solid #1D3829' : '1.5px solid #ddd',
                            borderRadius:10, cursor:'pointer',
                            background: isSelected ? '#f0f5f0' : '#fff',
                            marginBottom:4
                          }}>
                          <span style={{fontSize:18}}>{isSelected ? '✅' : '⬜'}</span>
                          <div>
                            <div style={{fontSize:14,fontWeight:600,color:'#1a1a1a'}}>{recipeName}</div>
                            <div style={{fontSize:11,color:'#888',marginTop:2}}>{r.category || ''}{r.difficulty ? ` · ${r.difficulty}` : ''}{r.rating ? ` · ⭐ ${r.rating}` : ''}</div>
                          </div>
                        </div>
                      );
                    })}
                </div>
                <div className="share-modal-actions">
                  <button className="btn-cancel-share" onClick={() => { setShowShareModal(false); setSelectedRecipes([]); setShareSearch(''); }}>Cancel</button>
                  <button className="btn-confirm-share" onClick={handleShare} disabled={sharing || selectedRecipes.length === 0}>
                    {sharing ? 'Sharing...' : `Share ${selectedRecipes.length > 0 ? selectedRecipes.length : ''} Recipe${selectedRecipes.length !== 1 ? 's' : ''}`}
                  </button>
                </div>
              </div>
            </div>
          )}

          {selectedRecipe && (
            <div className="share-modal-overlay" onClick={e => e.target === e.currentTarget && setSelectedRecipe(null)}>
              <div className="share-modal" style={{maxWidth:560}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4}}>
                  <h3 style={{fontFamily:'Playfair Display, serif',fontSize:24,lineHeight:1.2}}>{selectedRecipe.title}</h3>
                  <button onClick={() => setSelectedRecipe(null)} style={{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'#888',padding:'0 4px',lineHeight:1}}>×</button>
                </div>
                {selectedRecipe.photo_url && <img src={selectedRecipe.photo_url} alt={selectedRecipe.title} style={{width:'100%',height:200,objectFit:'cover',borderRadius:10,marginBottom:12}} />}
                <div style={{fontSize:12,color:'#888',marginBottom:12}}>Shared by <strong>{selectedRecipe.shared_by}</strong> · {selectedRecipe.category} · {selectedRecipe.difficulty}</div>
                <Stars rating={selectedRecipe.rating || 5} size={14} />
                <div style={{display:'flex',gap:16,margin:'12px 0',fontSize:13,color:'#666'}}>
                  {selectedRecipe.prep_time && <span>⏱ Prep: {selectedRecipe.prep_time}</span>}
                  {selectedRecipe.cook_time && <span>🔥 Cook: {selectedRecipe.cook_time}</span>}
                  {selectedRecipe.serves && <span>👥 Serves: {selectedRecipe.serves}</span>}
                </div>
                {selectedRecipe.description && <p style={{fontSize:14,color:'#555',marginBottom:14,lineHeight:1.6}}>{selectedRecipe.description}</p>}
                {selectedRecipe.ingredients && (
                  <div style={{marginBottom:14}}>
                    <div style={{fontWeight:700,fontSize:13,textTransform:'uppercase',letterSpacing:1,marginBottom:8}}>Ingredients</div>
                    <div style={{fontSize:14,color:'#444',lineHeight:1.8,whiteSpace:'pre-line'}}>{selectedRecipe.ingredients}</div>
                  </div>
                )}
                {selectedRecipe.method && (
                  <div style={{marginBottom:20}}>
                    <div style={{fontWeight:700,fontSize:13,textTransform:'uppercase',letterSpacing:1,marginBottom:8}}>Method</div>
                    <div style={{fontSize:14,color:'#444',lineHeight:1.8,whiteSpace:'pre-line'}}>{selectedRecipe.method}</div>
                  </div>
                )}
                <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
                  {(isLeo || selectedRecipe.shared_by === user.name) && (
                    <button onClick={() => handleRemove(selectedRecipe)} style={{padding:'10px 18px',background:'transparent',border:'1.5px solid #ffaaaa',color:'#c00',borderRadius:8,fontFamily:'inherit',fontSize:13,fontWeight:600,cursor:'pointer'}}>🗑️ Remove</button>
                  )}
                  {!(saved[selectedRecipe.id] || myRecipes.some(m => (m.name||m.title||'').toLowerCase() === (selectedRecipe.title||'').toLowerCase())) && (
                    <button onClick={() => { handleSave(selectedRecipe); setSelectedRecipe(null); }} style={{padding:'10px 20px',background:'#1D3829',color:'#fff',border:'none',borderRadius:8,fontFamily:'inherit',fontSize:13,fontWeight:600,cursor:'pointer'}}>❤️ Save to my collection</button>
                  )}
                  <button onClick={() => setSelectedRecipe(null)} style={{padding:'10px 18px',background:'transparent',border:'1.5px solid #ddd',borderRadius:8,fontFamily:'inherit',fontSize:13,cursor:'pointer'}}>Close</button>
                </div>
              </div>
            </div>
          )}

          {toast && (
            <div style={{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',background:'#1D3829',color:'#fff',padding:'12px 24px',borderRadius:10,fontSize:14,fontWeight:600,zIndex:999,boxShadow:'0 4px 16px rgba(0,0,0,0.2)'}}>
              {toast}
            </div>
          )}
        </div>
      );
    };

    // ── NOTIFICATION CENTRE ──
    const MessageCard = ({ m, onReply }) => {
      const [replying, setReplying] = useState(false);
      const [replyText, setReplyText] = useState(m.reply || '');
      const [saving, setSaving] = useState(false);

      const handleSave = async () => {
        if (!replyText.trim()) return;
        setSaving(true);
        await onReply(m.id, replyText.trim());
        setSaving(false);
        setReplying(false);
      };

      return (
        <div style={{background:'#fff',borderRadius:14,overflow:'hidden',boxShadow:'0 2px 12px rgba(0,0,0,0.06)',border:'1.5px solid #e2e8f0'}}>
          <div style={{padding:'16px 18px'}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
              <div style={{width:36,height:36,borderRadius:'50%',background:'#1D3829',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:15,flexShrink:0}}>
                {m.from_name ? m.from_name[0].toUpperCase() : '?'}
              </div>
              <div>
                <div style={{fontWeight:700,fontSize:14,color:'#1a1a1a'}}>{m.from_name || 'Unknown'}</div>
                <div style={{fontSize:11,color:'#aaa'}}>{m.sent_at ? new Date(m.sent_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : ''}</div>
              </div>
            </div>
            <div style={{fontSize:14,color:'#333',lineHeight:1.6,background:'#f8f9fa',borderRadius:10,padding:'12px 14px',whiteSpace:'pre-wrap'}}>{m.message}</div>
          </div>

          {m.reply && !replying ? (
            <div style={{background:'#1D3829',padding:'14px 18px'}}>
              <div style={{fontSize:11,color:'rgba(255,255,255,0.5)',marginBottom:4}}>Your reply · {m.replied_at ? new Date(m.replied_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : ''}</div>
              <div style={{fontSize:14,color:'#fff',lineHeight:1.5,marginBottom:10}}>{m.reply}</div>
              <button onClick={() => { setReplying(true); }} style={{fontSize:12,color:'rgba(255,255,255,0.7)',background:'none',border:'1px solid rgba(255,255,255,0.3)',borderRadius:6,padding:'4px 10px',cursor:'pointer',fontFamily:'inherit'}}>✏️ Edit reply</button>
            </div>
          ) : replying ? (
            <div style={{padding:'14px 18px',borderTop:'1px solid #f0f0f0'}}>
              <textarea
                value={replyText}
                onChange={e => setReplyText(e.target.value)}
                placeholder="Type your reply..."
                rows={3}
                autoFocus
                style={{width:'100%',padding:'10px 12px',border:'1.5px solid #DDD6C8',borderRadius:10,fontFamily:'inherit',fontSize:13,resize:'vertical',background:'#FAF7F2',outline:'none',color:'#1a1a1a',marginBottom:10}}
              />
              <div style={{display:'flex',gap:8}}>
                <button onClick={() => { setReplying(false); setReplyText(m.reply||''); }} style={{flex:1,padding:'9px 0',background:'transparent',border:'1.5px solid #ddd',borderRadius:8,fontFamily:'inherit',fontSize:13,color:'#666',cursor:'pointer'}}>Cancel</button>
                <button onClick={handleSave} disabled={saving||!replyText.trim()} style={{flex:2,padding:'9px 0',background:'#1D3829',color:'#fff',border:'none',borderRadius:8,fontFamily:'inherit',fontSize:13,fontWeight:700,cursor:'pointer',opacity:(saving||!replyText.trim())?0.5:1}}>
                  {saving ? 'Sending...' : '📨 Send Reply'}
                </button>
              </div>
            </div>
          ) : (
            <div style={{padding:'12px 18px',borderTop:'1px solid #f0f0f0'}}>
              <button onClick={() => setReplying(true)} style={{width:'100%',padding:'9px 0',background:'#f8f9fa',border:'1.5px solid #e2e8f0',borderRadius:8,fontFamily:'inherit',fontSize:13,fontWeight:600,color:'#1D3829',cursor:'pointer'}}>
                💬 Reply
              </button>
            </div>
          )}
        </div>
      );
    };

    const NotificationCentre = ({ user, onBack }) => {
      const [pendingRecipes, setPendingRecipes] = useState([]);
      const [messages, setMessages] = useState([]);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('recipes');
      const [actionLoading, setActionLoading] = useState(null);
      const [toast, setToast] = useState('');
      const toastRef = useRef(null);

      const showToast = msg => {
        if (toastRef.current) clearTimeout(toastRef.current);
        setToast(msg);
        toastRef.current = setTimeout(() => setToast(''), 3000);
      };

      const loadPending = async () => {
        const [recipes, msgs] = await Promise.all([fetchPendingRecipes(), fetchMessages()]);
        setPendingRecipes(recipes);
        setMessages(msgs);
        setLoading(false);
        markAllMessagesRead();
      };

      useEffect(() => { loadPending(); }, []);

      const handleApprove = async (r) => {
        setActionLoading(r.id + '_approve');
        await approveCommunityRecipe(r.id);
        showToast(`✅ "${r.title}" is now live!`);
        await loadPending();
        setActionLoading(null);
      };

      const handleReject = async (r) => {
        if (!window.confirm(`Reject "${r.title}"? They will be notified.`)) return;
        setActionLoading(r.id + '_reject');
        await rejectCommunityRecipe(r.id);
        showToast(`❌ "${r.title}" rejected`);
        await loadPending();
        setActionLoading(null);
      };

      return (
        <div style={{minHeight:'100vh',background:'var(--bg)',fontFamily:'Inter,system-ui,sans-serif'}}>
          <header style={{background:'var(--header)',color:'#fff',padding:'0 24px',height:60,display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:100}}>
            <div style={{fontFamily:'Playfair Display,serif',fontSize:18,fontWeight:600,display:'flex',alignItems:'center',gap:8}}>
              <span style={{opacity:0.7}}>✦</span> Notification Centre
            </div>
            <button onClick={onBack} style={{background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.3)',color:'#fff',padding:'7px 16px',borderRadius:8,fontFamily:'inherit',fontSize:13,cursor:'pointer'}}>← Back</button>
          </header>

          <div style={{maxWidth:600,margin:'0 auto',padding:'32px 20px'}}>

            {/* QR code setup */}
            <div style={{background:'#fff',borderRadius:16,padding:'20px 24px',marginBottom:28,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',display:'flex',alignItems:'center',gap:20,flexWrap:'wrap'}}>
              <img
                src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://leogivon9-blip.github.io/mise-en-place"
                alt="QR code"
                style={{width:100,height:100,borderRadius:8,flexShrink:0}}
              />
              <div>
                <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>📱 Open on your phone</div>
                <div style={{fontSize:13,color:'#666',lineHeight:1.6}}>Scan this QR code with your phone camera to open Mise en Place directly!</div>
              </div>
            </div>

            {/* Tabs */}
            <div style={{display:'flex',background:'#f3f4f6',borderRadius:12,padding:4,marginBottom:24,gap:4}}>
              <button
                onClick={() => setActiveTab('recipes')}
                style={{flex:1,padding:'10px 0',border:'none',borderRadius:9,fontFamily:'inherit',fontSize:13,fontWeight:600,cursor:'pointer',background:activeTab==='recipes'?'#fff':'transparent',color:activeTab==='recipes'?'#1D3829':'#888',boxShadow:activeTab==='recipes'?'0 1px 4px rgba(0,0,0,0.1)':'none',transition:'all 0.15s',position:'relative'}}>
                🔑 Recipes
                {!loading && pendingRecipes.length > 0 && <span style={{position:'absolute',top:4,right:8,background:'#ef4444',color:'#fff',borderRadius:'50%',width:16,height:16,display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:800}}>{pendingRecipes.length}</span>}
              </button>
              <button
                onClick={() => setActiveTab('messages')}
                style={{flex:1,padding:'10px 0',border:'none',borderRadius:9,fontFamily:'inherit',fontSize:13,fontWeight:600,cursor:'pointer',background:activeTab==='messages'?'#fff':'transparent',color:activeTab==='messages'?'#1D3829':'#888',boxShadow:activeTab==='messages'?'0 1px 4px rgba(0,0,0,0.1)':'none',transition:'all 0.15s',position:'relative'}}>
                💬 Messages
                {!loading && messages.length > 0 && <span style={{position:'absolute',top:4,right:8,background:'#1D3829',color:'#fff',borderRadius:'50%',width:16,height:16,display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:800}}>{messages.length}</span>}
              </button>
            </div>

            {loading ? (
              <div style={{textAlign:'center',padding:40,color:'#888',fontSize:14}}>Loading...</div>
            ) : activeTab === 'recipes' ? (
              <>
                <div style={{fontWeight:700,fontSize:18,marginBottom:16,color:'var(--dark-green)'}}>
                  🔑 Pending Approval {<span style={{background:'#ef4444',color:'#fff',borderRadius:20,padding:'2px 10px',fontSize:13,marginLeft:8}}>{pendingRecipes.length}</span>}
                </div>
                {pendingRecipes.length === 0 ? (
                  <div style={{background:'#fff',borderRadius:16,padding:'40px 24px',textAlign:'center',boxShadow:'0 2px 12px rgba(0,0,0,0.06)'}}>
                    <div style={{fontSize:48,marginBottom:12}}>✅</div>
                    <div style={{fontWeight:700,fontSize:16,marginBottom:6}}>All caught up!</div>
                    <div style={{fontSize:14,color:'#888'}}>No recipes waiting for approval.</div>
                  </div>
                ) : (
                  <div style={{display:'flex',flexDirection:'column',gap:12}}>
                    {pendingRecipes.map(r => (
                      <div key={r.id} style={{background:'#fff',borderRadius:14,padding:'18px 20px',boxShadow:'0 2px 12px rgba(0,0,0,0.06)',border:'1.5px solid #fcd34d'}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
                          <div>
                            <div style={{fontWeight:700,fontSize:16,color:'#1a1a1a',marginBottom:3}}>{r.title}</div>
                            <div style={{fontSize:13,color:'#888'}}>by <strong>{r.shared_by}</strong> · {r.category || 'No category'}{r.difficulty ? ` · ${r.difficulty}` : ''}</div>
                          </div>
                          <span style={{background:'#fffbea',border:'1px solid #fcd34d',color:'#92400e',borderRadius:6,padding:'3px 8px',fontSize:11,fontWeight:600,flexShrink:0,marginLeft:8}}>⏳ Pending</span>
                        </div>
                        {r.description && <div style={{fontSize:13,color:'#666',marginBottom:12,lineHeight:1.5}}>{r.description}</div>}
                        <div style={{display:'flex',gap:10,marginTop:4}}>
                          <button
                            onClick={() => handleApprove(r)}
                            disabled={!!actionLoading}
                            style={{flex:1,padding:'10px 0',background:'#1D3829',color:'#fff',border:'none',borderRadius:9,fontFamily:'inherit',fontSize:14,fontWeight:700,cursor:'pointer',opacity:actionLoading===r.id+'_approve'?0.6:1}}>
                            {actionLoading===r.id+'_approve' ? 'Approving...' : '✅ Approve'}
                          </button>
                          <button
                            onClick={() => handleReject(r)}
                            disabled={!!actionLoading}
                            style={{flex:1,padding:'10px 0',background:'transparent',border:'2px solid #ffaaaa',color:'#c00',borderRadius:9,fontFamily:'inherit',fontSize:14,fontWeight:600,cursor:'pointer',opacity:actionLoading===r.id+'_reject'?0.6:1}}>
                            {actionLoading===r.id+'_reject' ? 'Rejecting...' : '❌ Reject'}
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </>
            ) : (
              <>
                <div style={{fontWeight:700,fontSize:18,marginBottom:16,color:'var(--dark-green)'}}>
                  💬 Messages <span style={{background:'#1D3829',color:'#fff',borderRadius:20,padding:'2px 10px',fontSize:13,marginLeft:8}}>{messages.length}</span>
                </div>
                {messages.length === 0 ? (
                  <div style={{background:'#fff',borderRadius:16,padding:'40px 24px',textAlign:'center',boxShadow:'0 2px 12px rgba(0,0,0,0.06)'}}>
                    <div style={{fontSize:48,marginBottom:12}}>💬</div>
                    <div style={{fontWeight:700,fontSize:16,marginBottom:6}}>No messages yet</div>
                    <div style={{fontSize:14,color:'#888'}}>When users send you questions or feedback, they'll appear here.</div>
                  </div>
                ) : (
                  <div style={{display:'flex',flexDirection:'column',gap:12}}>
                    {messages.map(m => (
                      <MessageCard key={m.id} m={m} onReply={async (id, text) => {
                        await sendReply(id, text);
                        const updated = await fetchMessages();
                        setMessages(updated);
                      }} />
                    ))}
                  </div>
                )}
              </>
            )}
          </div>

          {toast && (
            <div style={{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',background:'#1D3829',color:'#fff',padding:'12px 24px',borderRadius:10,fontSize:14,fontWeight:600,zIndex:999,boxShadow:'0 4px 16px rgba(0,0,0,0.2)'}}>
              {toast}
            </div>
          )}
        </div>
      );
    };

    // ── APP ROOT ──
    const App = () => {
      const [user, setUser]       = useState(() => getCurrentUser());
      const [recipes, setRecipes] = useState(() => {
        const u = getCurrentUser();
        return u ? getRecipeText(u.email).map(r => ({ ...r, photo: null })) : [];
      });
      const [view, setView]       = useState('list');
      const [currentId, setId]    = useState(null);
      const [showMessageModal, setShowMessageModal] = useState(false);

      // Load photos from IndexedDB after mount
      useEffect(() => {
        if (!user) return;
        const load = async () => {
          Object.keys(localStorage).filter(k => k.startsWith('mep_photo_')).forEach(k => {
            const id = k.replace('mep_photo_', '');
            const photo = localStorage.getItem(k);
            if (photo) { idbPut(id, photo); localStorage.removeItem(k); }
          });
          const photos = await idbGetAll();
          setRecipes(prev => prev.map(r => ({ ...r, photo: photos[r.id] || null })));
        };
        load();
      }, [user]);

      const persist = (r, email) => {
        setRecipes(r);
        saveRecipeText(r, email || user?.email);
        // Save to cloud in background
        const em = email || user?.email;
        if (em) r.forEach(recipe => saveRecipeToCloud(recipe, em));
      };

      const handleLogin = u => {
        setUser(u);
        localStorage.setItem('mep_session', u.email);
        setRecipes([]);
        // Load from cloud first, fall back to localStorage
        loadRecipesFromCloud(u.email).then(async cloudRecipes => {
          let userRecipes = cloudRecipes;
          if (!userRecipes) {
            userRecipes = getRecipeText(u.email);
            if (userRecipes.length === 0 && Object.keys(getUsers()).length === 1) {
              userRecipes = SEED_RECIPES;
            }
            // Migrate localStorage recipes to cloud
            if (userRecipes.length > 0) saveAllRecipesToCloud(userRecipes, u.email);
          }
          saveRecipeText(userRecipes, u.email);
          setRecipes(userRecipes.map(r => ({ ...r, photo: null })));
          const photos = await idbGetAll();
          setRecipes(prev => prev.map(r => ({ ...r, photo: photos[r.id] || r.photoUrl || null })));
        });
      };
      const handleSignOut       = () => { localStorage.removeItem('mep_session'); setUser(null); setRecipes([]); setView('list'); };
      const handleAdd           = () => { setId(null); setView('add'); };
      const handleView          = id => { setId(id);   setView('detail'); };
      const handleEdit          = id => { setId(id);   setView('edit'); };
      const handleBack          = () => { setView('list'); setId(null); };
      const handleBackToDetail  = () => setView('detail');
      const handleCommunity     = () => setView('community');
      const handleNotifications = () => setView('notifications');
      const handleMessage       = () => setShowMessageModal(true);

      const handleSave = form => {
        if (view === 'edit') {
          const updated = recipes.map(r => r.id === currentId ? { ...r, ...form } : r);
          persist(updated);
          idbPut(currentId, form.photo || null);
          setView('detail');
          if (form.photo) uploadPhotoToSupabase(user.email, currentId, form.photo).then(photoUrl => {
            if (photoUrl) setRecipes(prev => { const u = prev.map(r => r.id === currentId ? { ...r, photoUrl } : r); saveRecipeText(u, user.email); saveRecipeToCloud({...u.find(r=>r.id===currentId)}, user.email); return u; });
          });
        } else {
          const newId = Date.now().toString();
          const newR = { ...form, id: newId, addedDate: new Date().toISOString().split('T')[0] };
          persist([...recipes, newR]);
          idbPut(newId, form.photo || null);
          setView('list');
          if (form.photo) uploadPhotoToSupabase(user.email, newId, form.photo).then(photoUrl => {
            if (photoUrl) setRecipes(prev => { const u = prev.map(r => r.id === newId ? { ...r, photoUrl } : r); saveRecipeText(u, user.email); saveRecipeToCloud({...u.find(r=>r.id===newId)}, user.email); return u; });
          });
        }
      };

      const handleDelete = id => {
        idbDelete(id);
        deleteRecipeFromCloud(id, user.email);
        persist(recipes.filter(r => r.id !== id));
        setView('list');
      };

      const handleChangePhoto = (id, photo) => {
        setRecipes(prev => prev.map(r => r.id === id ? { ...r, photo } : r));
        idbPut(id, photo);
        if (photo) uploadPhotoToSupabase(user.email, id, photo).then(photoUrl => {
          if (photoUrl) setRecipes(prev => { const u = prev.map(r => r.id === id ? { ...r, photoUrl } : r); saveRecipeText(u, user.email); return u; });
        });
      };

      if (!user) return <LoginPage onLogin={handleLogin} />;

      if (view === 'add') {
        return <RecipeForm onSave={handleSave} onCancel={handleBack} />;
      }

      if (view === 'edit') {
        const recipe = recipes.find(r => r.id === currentId);
        if (!recipe) { setView('list'); return null; }
        return <RecipeForm recipe={recipe} onSave={handleSave} onCancel={handleBackToDetail} />;
      }

      if (view === 'detail') {
        const recipe = recipes.find(r => r.id === currentId);
        if (!recipe) { setView('list'); return null; }
        return <RecipeDetailPage recipe={recipe}
          onBack={handleBack} onEdit={handleEdit}
          onDelete={handleDelete} onChangePhoto={handleChangePhoto} />;
      }

      if (view === 'notifications') {
        return <NotificationCentre user={user} onBack={handleBack} />;
      }

      if (view === 'community') {
        return <CommunityPage user={user} myRecipes={recipes.map(({photo, ...r}) => r)} onBack={handleBack} onSaveRecipe={r => {
          const newId = Date.now().toString();
          const newR = { ...r, id: newId, name: r.name || r.title || '', addedDate: new Date().toISOString().split('T')[0], photo: null };
          persist([...recipes, newR]);
          idbPut(newId, null);
        }} />;
      }

      return (
        <>
          <RecipeListPage user={user} recipes={recipes}
            onAdd={handleAdd} onView={handleView} onSignOut={handleSignOut}
            onCommunity={handleCommunity} onNotifications={handleNotifications}
            onMessage={handleMessage} />
          {showMessageModal && <MessageModal user={user} onClose={() => setShowMessageModal(false)} />}
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
    const ls = document.getElementById('loading-screen');
    if (ls) ls.style.display = 'none';
  </script>
</body>
</html>
